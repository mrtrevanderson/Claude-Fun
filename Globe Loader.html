<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Globe Loader</title>
<style>
  :root {
    --bg: oklch(0.97 0.005 90);
    --fg: oklch(0.22 0.005 90);
    --fg-soft: oklch(0.22 0.005 90 / 0.55);
    --fg-faint: oklch(0.22 0.005 90 / 0.18);
  }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
  }
  body {
    display: grid;
    place-items: center;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .stage {
    position: relative;
    display: grid;
    place-items: center;
  }
  .stage svg.globe {
    display: block;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  .stage svg.globe:active { cursor: grabbing; }
  .stage svg.whirl {
    position: absolute;
    inset: 50% auto auto 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    overflow: visible;
  }
  /* whirl rotations are applied to inner <g class="whirl-spin"> via CSS variable speeds */
  .ring-a, .ring-b, .ring-c {
    transform-origin: center center;
    transform-box: fill-box;
  }
  .ring-a { animation: spin var(--whirl-a, 4.2s) linear infinite; }
  .ring-b { animation: spinR var(--whirl-b, 6.5s) linear infinite; }
  .ring-c { animation: spin var(--whirl-c, 9s) linear infinite; }
  @keyframes spin  { to { transform: rotate(360deg); } }
  @keyframes spinR { to { transform: rotate(-360deg); } }

  .mote { fill: var(--fg-soft); }

  .sphere {
    fill: none;
    stroke: var(--fg);
    stroke-width: 1.25;
  }
  .graticule {
    fill: none;
    stroke: var(--fg);
    stroke-width: 0.5;
    stroke-opacity: 0.25;
  }
  .land {
    fill: var(--fg);
    fill-opacity: 0.92;
    stroke: none;
  }
  .shade { fill: url(#shade); pointer-events: none; }
</style>
</head>
<body>
  <div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
<script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>

<script type="text/babel">
// ── tweaks-panel (inlined) ──────────────────────────────────────────────────

const __TWEAKS_STYLE = `
  .twk-panel{position:fixed;right:16px;bottom:16px;z-index:2147483646;width:280px;
    max-height:calc(100vh - 32px);display:flex;flex-direction:column;
    background:rgba(250,249,247,.78);color:#29261b;
    -webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);
    border:.5px solid rgba(255,255,255,.6);border-radius:14px;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 12px 40px rgba(0,0,0,.18);
    font:11.5px/1.4 ui-sans-serif,system-ui,-apple-system,sans-serif;overflow:hidden}
  .twk-hd{display:flex;align-items:center;justify-content:space-between;
    padding:10px 8px 10px 14px;cursor:move;user-select:none}
  .twk-hd b{font-size:12px;font-weight:600;letter-spacing:.01em}
  .twk-x{appearance:none;border:0;background:transparent;color:rgba(41,38,27,.55);
    width:22px;height:22px;border-radius:6px;cursor:default;font-size:13px;line-height:1}
  .twk-x:hover{background:rgba(0,0,0,.06);color:#29261b}
  .twk-body{padding:2px 14px 14px;display:flex;flex-direction:column;gap:10px;
    overflow-y:auto;overflow-x:hidden;min-height:0;
    scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  .twk-body::-webkit-scrollbar{width:8px}
  .twk-body::-webkit-scrollbar-track{background:transparent;margin:2px}
  .twk-body::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px;
    border:2px solid transparent;background-clip:content-box}
  .twk-body::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,.25);
    border:2px solid transparent;background-clip:content-box}
  .twk-row{display:flex;flex-direction:column;gap:5px}
  .twk-row-h{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
  .twk-lbl{display:flex;justify-content:space-between;align-items:baseline;
    color:rgba(41,38,27,.72)}
  .twk-lbl>span:first-child{font-weight:500}
  .twk-val{color:rgba(41,38,27,.5);font-variant-numeric:tabular-nums}
  .twk-sect{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    color:rgba(41,38,27,.45);padding:10px 0 0}
  .twk-sect:first-child{padding-top:0}
  .twk-field{appearance:none;width:100%;height:26px;padding:0 8px;
    border:.5px solid rgba(0,0,0,.1);border-radius:7px;
    background:rgba(255,255,255,.6);color:inherit;font:inherit;outline:none}
  .twk-field:focus{border-color:rgba(0,0,0,.25);background:rgba(255,255,255,.85)}
  .twk-slider{appearance:none;-webkit-appearance:none;width:100%;height:4px;margin:6px 0;
    border-radius:999px;background:rgba(0,0,0,.12);outline:none}
  .twk-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:14px;height:14px;border-radius:50%;background:#fff;
    border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}
  .twk-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
    background:#fff;border:.5px solid rgba(0,0,0,.12);box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:default}
  .twk-toggle{position:relative;width:32px;height:18px;border:0;border-radius:999px;
    background:rgba(0,0,0,.15);transition:background .15s;cursor:default;padding:0}
  .twk-toggle[data-on="1"]{background:#34c759}
  .twk-toggle i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
    background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
  .twk-toggle[data-on="1"] i{transform:translateX(14px)}
  .twk-open-btn{position:fixed;right:16px;bottom:16px;z-index:2147483645;
    appearance:none;border:0;border-radius:10px;padding:6px 12px;
    background:rgba(250,249,247,.85);color:#29261b;
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    border:.5px solid rgba(255,255,255,.6);
    box-shadow:0 4px 16px rgba(0,0,0,.14);
    font:11.5px/1.4 ui-sans-serif,system-ui,sans-serif;font-weight:600;
    cursor:default;letter-spacing:.01em}
  .twk-open-btn:hover{background:rgba(250,249,247,.95)}
`;

function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
  }, []);
  return [values, setTweak];
}

function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(clampToViewport) : null;
    if (ro) { ro.observe(document.documentElement); return () => ro.disconnect(); }
    window.addEventListener('resize', clampToViewport);
    return () => window.removeEventListener('resize', clampToViewport);
  }, [open, clampToViewport]);

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - e.clientY),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      {!open && (
        <button className="twk-open-btn" onClick={() => setOpen(true)}>Tweaks</button>
      )}
      {open && (
        <div ref={dragRef} className="twk-panel"
             style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
          <div className="twk-hd" onMouseDown={onDragStart}>
            <b>{title}</b>
            <button className="twk-x" aria-label="Close tweaks"
                    onMouseDown={(e) => e.stopPropagation()}
                    onClick={() => setOpen(false)}>✕</button>
          </div>
          <div className="twk-body">{children}</div>
        </div>
      )}
    </>
  );
}

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

// ── Globe Loader ────────────────────────────────────────────────────────────

const { useState, useEffect, useRef, useMemo } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "size": 640,
  "spinSpeed": 11,
  "autoSpin": true,
  "whirl": false,
  "whirlScale": 1.8
}/*EDITMODE-END*/;

// Cache the world atlas across renders
let worldPromise = null;
function loadWorld() {
  if (!worldPromise) {
    worldPromise = fetch('https://unpkg.com/world-atlas@2/countries-110m.json')
      .then(r => r.json())
      .then(world => topojson.feature(world, world.objects.countries));
  }
  return worldPromise;
}

function GlobeLoader({ size, spinSpeed, autoSpin, whirl, whirlScale }) {
  const W = size, H = size;
  const R = size * 0.42;            // globe radius
  const whirlSize = size * 1.4 * whirlScale;
  const cx = whirlSize / 2;

  const gratRef = useRef(null);
  const landRef = useRef(null);
  const svgRef = useRef(null);
  const [land, setLand] = useState(null);

  // rotation as a ref so the animation loop reads the latest without restarting
  const rotRef = useRef([0, -15, 0]);
  const autoRef = useRef(autoSpin);
  useEffect(() => { autoRef.current = autoSpin; }, [autoSpin]);

  useEffect(() => {
    let cancelled = false;
    loadWorld().then(l => { if (!cancelled) setLand(l); });
    return () => { cancelled = true; };
  }, []);

  // Build projection / path; rebuild when size changes
  const projection = useMemo(() => (
    d3.geoOrthographic()
      .scale(R)
      .translate([W / 2, H / 2])
      .clipAngle(90)
      .rotate(rotRef.current)
  ), [W, H, R]);
  const pathGen = useMemo(() => d3.geoPath(projection), [projection]);
  const graticule = useMemo(() => d3.geoGraticule10(), []);

  // Animation loop
  useEffect(() => {
    let raf;
    let last = performance.now();
    function frame(now) {
      const dt = (now - last) / 1000;
      last = now;
      if (autoRef.current) {
        const r = rotRef.current;
        rotRef.current = [r[0] + spinSpeed * dt, r[1], r[2]];
      }
      projection.rotate(rotRef.current);
      if (gratRef.current) gratRef.current.setAttribute('d', pathGen(graticule) || '');
      if (landRef.current && land) landRef.current.setAttribute('d', pathGen(land) || '');
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    return () => cancelAnimationFrame(raf);
  }, [projection, pathGen, graticule, land, spinSpeed]);

  // Drag handling — horizontal drag = longitude (lambda), vertical drag = latitude (phi)
  useEffect(() => {
    const el = svgRef.current;
    if (!el) return;
    let dragging = false;
    let lastX = 0, lastY = 0;
    let wasAuto = false;

    const sensitivity = 0.5; // deg per pixel; scales with size implicitly via radius

    function onDown(e) {
      dragging = true;
      wasAuto = autoRef.current;
      autoRef.current = false; // pause auto-spin while dragging
      lastX = e.clientX;
      lastY = e.clientY;
      el.setPointerCapture?.(e.pointerId);
    }
    function onMove(e) {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      const r = rotRef.current;
      let lambda = r[0] + dx * sensitivity;
      let phi    = r[1] - dy * sensitivity;
      // clamp phi so the globe doesn't flip awkwardly
      phi = Math.max(-89, Math.min(89, phi));
      rotRef.current = [lambda, phi, r[2]];
    }
    function onUp(e) {
      if (!dragging) return;
      dragging = false;
      autoRef.current = wasAuto; // resume previous auto state
      el.releasePointerCapture?.(e.pointerId);
    }

    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointermove', onMove);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);
    el.addEventListener('pointerleave', onUp);
    return () => {
      el.removeEventListener('pointerdown', onDown);
      el.removeEventListener('pointermove', onMove);
      el.removeEventListener('pointerup', onUp);
      el.removeEventListener('pointercancel', onUp);
      el.removeEventListener('pointerleave', onUp);
    };
  }, []);

  return (
    <div className="stage" style={{ width: size, height: size }}>
      {whirl && (
        <svg
          className="whirl"
          width={whirlSize}
          height={whirlSize}
          viewBox={`0 0 ${whirlSize} ${whirlSize}`}
          aria-hidden="true"
        >
          <g className="ring-a">
            <circle cx={cx} cy={cx} r={whirlSize * 0.457}
                    fill="none" stroke="oklch(0.22 0.005 90 / 0.55)"
                    strokeWidth={1.25} strokeLinecap="round"
                    strokeDasharray="60 40 24 60 14 200 38 70" pathLength="600"/>
            <circle cx={cx} cy={cx} r={whirlSize * 0.457}
                    fill="none" stroke="oklch(0.22 0.005 90 / 0.25)"
                    strokeWidth={0.75} strokeLinecap="round"
                    strokeDasharray="6 12" pathLength="600"/>
          </g>
          <g className="ring-b">
            <circle cx={cx} cy={cx} r={whirlSize * 0.421}
                    fill="none" stroke="oklch(0.22 0.005 90 / 0.4)"
                    strokeWidth={0.9} strokeLinecap="round"
                    strokeDasharray="2 10 28 90 4 12 60 30" pathLength="500"/>
            <circle className="mote" cx={cx} cy={whirlSize * 0.078} r={whirlSize * 0.0057}/>
            <circle className="mote" cx={whirlSize * 0.921} cy={cx} r={whirlSize * 0.0043}/>
            <circle className="mote" cx={cx} cy={whirlSize * 0.921} r={whirlSize * 0.0036}/>
            <circle className="mote" cx={whirlSize * 0.078} cy={cx} r={whirlSize * 0.005}/>
          </g>
          <g className="ring-c">
            <circle cx={cx} cy={cx} r={whirlSize * 0.485}
                    fill="none" stroke="oklch(0.22 0.005 90 / 0.18)"
                    strokeWidth={0.6} strokeLinecap="round"
                    strokeDasharray="1 9" pathLength="700"/>
            <circle className="mote" cx={cx} cy={whirlSize * 0.014} r={whirlSize * 0.0036}/>
            <circle className="mote" cx={whirlSize * 0.985} cy={cx} r={whirlSize * 0.0036}/>
            <circle className="mote" cx={cx} cy={whirlSize * 0.985} r={whirlSize * 0.0036}/>
            <circle className="mote" cx={whirlSize * 0.014} cy={cx} r={whirlSize * 0.0036}/>
          </g>
        </svg>
      )}
      <svg
        ref={svgRef}
        className="globe"
        width={W}
        height={H}
        viewBox={`0 0 ${W} ${H}`}
        aria-hidden="true"
      >
        <defs>
          <radialGradient id="shade" cx="38%" cy="36%" r="70%">
            <stop offset="0%"   stopColor="oklch(0.97 0.005 90)" stopOpacity="0.35"/>
            <stop offset="55%"  stopColor="oklch(0.97 0.005 90)" stopOpacity="0"/>
            <stop offset="100%" stopColor="oklch(0.10 0.005 90)" stopOpacity="0.20"/>
          </radialGradient>
          <clipPath id="diskClip">
            <circle cx={W/2} cy={H/2} r={R}/>
          </clipPath>
        </defs>
        <circle className="sphere" cx={W/2} cy={H/2} r={R}/>
        <g clipPath="url(#diskClip)">
          <path ref={gratRef} className="graticule"/>
          <path ref={landRef} className="land"/>
          <circle className="shade" cx={W/2} cy={H/2} r={R}/>
        </g>
      </svg>
    </div>
  );
}

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <>
      <GlobeLoader
        size={tweaks.size}
        spinSpeed={tweaks.spinSpeed}
        autoSpin={tweaks.autoSpin}
        whirl={tweaks.whirl}
        whirlScale={tweaks.whirlScale}
      />
      <TweaksPanel title="Tweaks">
        <TweakSection label="Globe">
          <TweakSlider
            label="Size"
            value={tweaks.size}
            min={120} max={640} step={4}
            onChange={(v) => setTweak('size', v)}
            unit="px"
          />
          <TweakSlider
            label="Spin speed"
            value={tweaks.spinSpeed}
            min={0} max={120} step={1}
            onChange={(v) => setTweak('spinSpeed', v)}
            unit="°/s"
          />
          <TweakToggle
            label="Auto-spin"
            value={tweaks.autoSpin}
            onChange={(v) => setTweak('autoSpin', v)}
          />
        </TweakSection>
        <TweakSection label="Whirl">
          <TweakToggle
            label="Show whirl"
            value={tweaks.whirl}
            onChange={(v) => setTweak('whirl', v)}
          />
          <TweakSlider
            label="Whirl scale"
            value={tweaks.whirlScale}
            min={0.8} max={1.8} step={0.02}
            onChange={(v) => setTweak('whirlScale', v)}
          />
        </TweakSection>
        <div style={{
          marginTop: 8,
          fontSize: 11,
          opacity: 0.6,
          lineHeight: 1.4,
        }}>
          Tip: click and drag the globe to rotate it on any axis.
        </div>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
